name: '[Reusable] S3 Write Pytest'

on:
  workflow_call:
    inputs:
      ACT_MODE:
        description: |
          For running Github Action Workflows locally with Nektos act.
        required: true
        type: boolean
      markers:
        description: |
          PyTest markers to select specific tests within Github Action Workflows.
        required: true
        type: string
      working_directory:
        description: |
          Working directory containing Terraform test scripts.
        required: false
        type: string
        default: './test'

    secrets:
      AWS_REGION:
        description: AWS region for boto3 and Terraform test execution.
        required: true
      TF_API_TOKEN:
        description: Terraform.io access token.
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  terraform-output:
    name: Terraform Output
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}

    outputs:
      BRONZE_BUCKET_ID: ${{ steps.tf-raw.outputs.BRONZE_BUCKET_ID }}
      SILVER_BUCKET_ID: ${{ steps.tf-raw.outputs.SILVER_BUCKET_ID }}
      GOLD_BUCKET_ID: ${{ steps.tf-raw.outputs.GOLD_BUCKET_ID }}
      ASSUME_ROLE_ARN: ${{ steps.tf-raw.outputs.ASSUME_ROLE_ARN }}
      CLIENT_ID: ${{ steps.tf-raw.outputs.CLIENT_ID }}
      CLIENT_SECRET: ${{ steps.tf-raw.outputs.CLIENT_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}
          terraform_wrapper: false

      - name: terraform init
        run: terraform init

      - name: terraform raw output
        id: tf-raw
        run: |
          echo "::add-mask::$(terraform output -raw service_account_client_id)"
          echo "::add-mask::$(terraform output -raw service_account_client_secret)"
          {
            echo "BRONZE_BUCKET_ID=$(terraform output -raw bronze_bucket_id)"
            echo "SILVER_BUCKET_ID=$(terraform output -raw silver_bucket_id)"
            echo "GOLD_BUCKET_ID=$(terraform output -raw gold_bucket_id)"
            echo "ASSUME_ROLE_ARN=$(terraform output -raw assume_role_arn)"
            echo "CLIENT_ID=${{ inputs.ACT_MODE && '$(terraform output -raw service_account_client_id)' || '' }}"
            echo "CLIENT_SECRET=${{ inputs.ACT_MODE && '$(terraform output -raw service_account_client_secret)' || '' }}"
          } >> "$GITHUB_OUTPUT"

  terraform-test:
    name: Terraform Test
    needs: [terraform-output]
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ needs.terraform-output.outputs.CLIENT_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ needs.terraform-output.outputs.CLIENT_SECRET }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}

    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}/unit_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Request GitHub OIDC token
        if: ${{ !inputs.ACT_MODE }}
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const idtoken = await core.getIDToken('sts.amazonaws.com')
            core.setOutput('IDTOKEN', idtoken)

      - name: Export test environment
        run: |
          {
            echo "BRONZE_BUCKET_ID=${{ needs.terraform-output.outputs.BRONZE_BUCKET_ID }}"
            echo "SILVER_BUCKET_ID=${{ needs.terraform-output.outputs.SILVER_BUCKET_ID }}"
            echo "GOLD_BUCKET_ID=${{ needs.terraform-output.outputs.GOLD_BUCKET_ID }}"
            echo "ASSUME_ROLE_ARN=${{ needs.terraform-output.outputs.ASSUME_ROLE_ARN }}"
            if [[ "${{ inputs.ACT_MODE }}" != "true" ]]; then
              echo "OIDC_TOKEN=${{ steps.oidc.outputs.IDTOKEN }}"
            fi
          } >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest boto3 fsspec s3fs

      - name: Test with pytest
        run: |
          pytest -m "${{ inputs.markers }}" \
            -rs \
            --doctest-modules \
            --junitxml=junit/test-results.xml

      - name: Upload pytest test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: ${{ inputs.working_directory }}/unit_test/junit/test-results.xml
